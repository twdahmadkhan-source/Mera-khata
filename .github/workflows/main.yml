name: Build Play Store AAB & APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --org com.merakhata.app .
      - run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/></application>"
          perm = "<uses-permission android:name=\"com.android.vending.BILLING\"/><application"
          open(p, "w").write(s.replace("<application", perm, 1).replace("</application>", meta, 1))
          '
      - run: |
          python3 -c '
          p = "lib/screens2.dart"
          s = open(p).read()
          i = s.find("BigBtn(red, Icons.logout")
          if i != -1: s = s[:i]
          t = "BigBtn(red, Icons.logout, \"Logout\", \"Logout\", () async { if (!await confirm(context, \"Pakka Logout Karna Hai?\")) return; final p = await SharedPreferences.getInstance(); await p.setBool(\"guest\", false); guest.value = false; }),]),);}}\nclass RecyclePage extends StatelessWidget { const RecyclePage({super.key}); @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text(\"Recycle Bin\")), body: const Center(child: Text(\"Recycle Bin khali hai\"))); }\n"
          open(p, "w").write(s + t)
          '
      - run: |
          cat << 'EOF' >> android/gradle.properties
          android.lint.checkReleaseBuilds=false
          EOF
      - run: flutter pub get
      - run: flutter build apk --debug
      - run: flutter build appbundle --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: playstore-files
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
