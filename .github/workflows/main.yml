name: Build Play Store AAB & APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --org com.merakhata.app .
      - run: |
          python3 -c '
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace("isMinifyEnabled = true", "isMinifyEnabled = false").replace("isShrinkResources = true", "isShrinkResources = false")
          if "isMinifyEnabled" not in s:
              s = s.replace("release {", "release {\n            isMinifyEnabled = false\n            isShrinkResources = false", 1)
          open(p, "w").write(s)
          '
      - run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/></application>"
          perm = "<uses-permission android:name=\"com.android.vending.BILLING\"/><queries><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"whatsapp\"/></intent><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"https\"/></intent><intent><action android:name=\"android.intent.action.DIAL\"/></intent></queries><application"
          open(p, "w").write(s.replace("<application", perm, 1).replace("</application>", meta, 1))
          '
      - run: |
          python3 -c '
          p = "lib/svc.dart"
          s = open(p).read()
          old = "https://wa.me{_num(phone)}?text="
          new = "whatsapp://send?phone=${_num(phone)}&text="
          open(p, "w").write(s.replace(old, new))
          '
      - run: |
          python3 -c '
          p = "lib/main.dart"
          s = open(p).read()
          open(p, "w").write(s.replace("await Svc.initMonetization();", "Svc.initMonetization();"))
          '
      - run: |
          python3 -c '
          p = "lib/screens2.dart"
          s = open(p).read()
          s = s.replace("s.data! == null", "s.data!.first == null")
          s = s.replace("final c = s.data! as M;", "final c = s.data!.first as M;")
          s = s.replace("final es = s.data! as List<M>;", "final es = s.data!.last as List<M>;")
          i = s.find("BigBtn(red, Icons.logout")
          if i != -1: s = s[:i]
          t = "BigBtn(red, Icons.logout, \"Logout\", \"Logout\", () async { if (!await confirm(context, \"Pakka Logout Karna Hai?\")) return; final p = await SharedPreferences.getInstance(); await p.setBool(\"guest\", false); guest.value = false; }),]),);}}\nclass RecyclePage extends StatelessWidget { const RecyclePage({super.key}); @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text(\"Recycle Bin\")), body: const Center(child: Text(\"Recycle Bin khali hai\"))); }\n"
          open(p, "w").write(s + t)
          '
      - run: flutter pub get
      - run: cd android && ./gradlew assembleRelease bundleRelease -x lintVitalAnalyzeRelease
      - uses: actions/upload-artifact@v4
        with:
          name: playstore-files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
