name: Build Play Store AAB & APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create --org com.merakhata.app .
      - run: |
          pip install pillow
          python3 -c '
          from PIL import Image, ImageDraw
          import glob
          img = Image.new("RGBA", (512, 512), (27, 94, 32, 255))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle(tuple((110, 70, 410, 442)), radius=36, fill=(255, 255, 255, 255))
          d.rectangle(tuple((110, 70, 155, 442)), fill=(255, 193, 7, 255))
          d.line(tuple((195, 175, 365, 175)), fill=(46, 125, 50, 255), width=22)
          d.line(tuple((195, 255, 365, 255)), fill=(46, 125, 50, 255), width=22)
          d.line(tuple((195, 335, 315, 335)), fill=(211, 47, 47, 255), width=22)
          for p in glob.glob("android/app/src/main/res/mipmap-*/ic_launcher.png"):
              s = Image.open(p).size
              img.resize(s, Image.LANCZOS).save(p)
          '
      - run: |
          keytool -genkey -v -keystore android/app/merakhata-keystore.jks -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 -alias merakhata -storepass merakhata123 -keypass merakhata123 -dname "CN=Mera Khata, OU=Mobile, O=Mera Khata, L=Malakand, S=KPK, C=PK"
          cat << 'EOF' > android/key.properties
          storePassword=merakhata123
          keyPassword=merakhata123
          keyAlias=merakhata
          storeFile=merakhata-keystore.jks
          EOF
      - run: |
          python3 -c '
          p = "android/app/build.gradle.kts"
          s = open(p).read()
          sign = """
          signingConfigs {
              create("release") {
                  storeFile = file("merakhata-keystore.jks")
                  storePassword = "merakhata123"
                  keyAlias = "merakhata"
                  keyPassword = "merakhata123"
              }
          }
          buildTypes {
              release {
                  signingConfig = signingConfigs.getByName("release")
                  isMinifyEnabled = false
                  isShrinkResources = false
          """
          s = s.replace("buildTypes {\n        release {", sign, 1).replace("buildTypes {\r\n        release {", sign, 1)
          s = s.replace("signingConfig = signingConfigs.getByName(\"debug\")", "")
          open(p, "w").write(s)
          '
      - run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          meta = "<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-3940256099942544~3347511713\"/></application>"
          perm = "<uses-permission android:name=\"com.android.vending.BILLING\"/><queries><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"whatsapp\"/></intent><intent><action android:name=\"android.intent.action.VIEW\"/><data android:scheme=\"https\"/></intent><intent><action android:name=\"android.intent.action.DIAL\"/></intent></queries><application"
          open(p, "w").write(s.replace("<application", perm, 1).replace("</application>", meta, 1))
          '
      - run: |
          python3 -c '
          p = "lib/svc.dart"
          s = open(p).read()
          open(p, "w").write(s.replace("https://wa.me{_num(phone)}?text=", "whatsapp://send?phone=${_num(phone)}&text="))
          '
      - run: |
          python3 -c '
          p = "lib/main.dart"
          s = open(p).read()
          open(p, "w").write(s.replace("await Svc.initMonetization();", "Svc.initMonetization();"))
          '
      - run: |
          python3 -c '
          p = "lib/screens2.dart"
          s = open(p).read()
          s = s.replace("s.data! == null", "s.data!.first == null")
          s = s.replace("final c = s.data! as M;", "final c = s.data!.first as M;")
          s = s.replace("final es = s.data! as List<M>;", "final es = s.data!.last as List<M>;")
          i = s.find("BigBtn(red, Icons.logout")
          if i != -1: s = s[:i]
          t = "BigBtn(red, Icons.logout, \"Logout\", \"Logout\", () async { if (!await confirm(context, \"Pakka Logout Karna Hai?\")) return; final p = await SharedPreferences.getInstance(); await p.setBool(\"guest\", false); guest.value = false; }),]),);}}\nclass RecyclePage extends StatelessWidget { const RecyclePage({super.key}); @override Widget build(BuildContext context) => Scaffold(appBar: AppBar(title: const Text(\"Recycle Bin\")), body: ValueListenableBuilder<int>(valueListenable: DB.tick, builder: (c, _, __) => FutureBuilder<List<M>>(future: DB.deleted(), builder: (c, s) { final l = s.data ?? <M>[]; if (l.isEmpty) return const Center(child: Text(\"Recycle Bin khali hai\", style: TextStyle(fontSize: 24))); return ListView(children: l.map((x) => Card(child: ListTile(leading: avatar(x, 30), title: Text(\"${x[\x27name\x27]}\", style: const TextStyle(fontSize: 22, fontWeight: FontWeight.bold)), trailing: FilledButton(style: FilledButton.styleFrom(backgroundColor: green), onPressed: () => DB.restore(x[\x27id\x27] as int), child: const Text(\"Wapis Lao\"))))).toList()); }))); }\n"
          open(p, "w").write(s + t)
          '
      - run: flutter pub get
      - run: cd android && ./gradlew assembleRelease bundleRelease -x lintVitalAnalyzeRelease
      - uses: actions/upload-artifact@v4
        with:
          name: playstore-files
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            android/app/merakhata-keystore.jks
